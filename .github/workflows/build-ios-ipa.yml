name: Build BlockCraft iOS IPA
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unzip and Setup iOS
        run: |
          unzip -o blockcraft-ios-package.zip
          npm install
          npx cap add ios
          npx cap sync ios
      - name: Build Unsigned IPA
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build CONFIGURATION_BUILD_DIR="$PWD/build"
          cd ../..
          mkdir -p Payload
          cp -r ios/App/build/App.app Payload/BlockCraft.app
          zip -r BlockCraft-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BlockCraft-iOS-IPA
          path: BlockCraft-unsigned.ipa

